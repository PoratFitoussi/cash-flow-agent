version: '3.8'

services:
  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    volumes:
      - ./client:/app
      - /app/node_modules
    restart: "no"

  server:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      - TZ=Asia/Jerusalem
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    restart: "no"
